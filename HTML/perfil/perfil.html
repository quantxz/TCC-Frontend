<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil do Desenvolvedor</title>
    <link rel="stylesheet" href="/CSS/perfil/perfil.css">
</head>

<body>
    <div class="Conteiner-Perfil">
        <div class="edit-perfil">
            <hr>
            <h1 class="title-Perfil">Personalização de conta</h1>
            <!-- personalização de perfil -->
            <label for="Nome">Digite seu novo Nome:</label>
            <input type="text" name="Nome" id="Name" placeholder="Digite seu nome"><br>
            <label for="Bio">Bio:</label>
            <input type="text" name="Bio" id="Bio" placeholder="Sua bio"><br>

            <!-- Campos para habilidades -->
            <label for="Habilidades">Habilidades:</label><br>
            <input type="text" id="HAB1" placeholder="Digite sua primeira habilidade"><br>
            <input type="text" id="HAB2" placeholder="Digite sua segunda habilidade"><br>
            <input type="text" id="HAB3" placeholder="Digite sua terceira habilidade"><br>

            <!-- Contêiner de pré-visualização da imagem -->
            <div id="imgPreviewContainer" style="display: none; margin-top: 10px;">
                <img id="imgPreview" src="" alt="Pré-visualização">
            </div>

            <input type="file" name="IMG-perfil" id="IMG-Input">
            <button id="IMG-Edit">Foto De Perfil</button>

            <button id="Salvar">Salvar</button>
            <!-- personalização de perfil -->
        </div>
        <div>
            <button id="Sair-personalizaçao">X</button>
        </div>
    </div>

    <div class="profile-container">
        <header class="profile-header">
            <div class="profile-picture">
                <div class="FotoPerfil"></div>
            </div>
            <div class="profile-info">
                <h1 class="NomeTXT"></h1>
                <p class="UsernameTXT">@</p>
                <p class="BioTXT"></p>
                <button id="EditarPerfil">Editar Perfil</button>
                <button id="EditarPortifolio">Editar Portifolio</button>
            </div>
        </header>
        <section class="profile-skills">
            <h2>Habilidades</h2>
            <ul>
                <li class="habilidade1"></li>
                <li class="habilidade2"></li>
                <li class="habilidade3"></li>
            </ul>
        </section>
    </div>

    <script src="../../js/gen/env/env.js"></script>
    <script src="../../js/api/api-class.js"></script>
    <script src="/js/perfil/perfil.js"></script>
    <script src="/js/perfil/Potifolio.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        const api = new API();

        document.addEventListener("DOMContentLoaded", async () => {
            const nick = sessionStorage.getItem("userNickname");
            const projs = await fetch(`https://api.github.com/users/${nick}/repos`);
            const projects = await projs.json();

            const res = await api.findUser(nick);
            if (res && res.returnedData) {
                const user = res.returnedData;

                document.getElementById("Name").value = user.name;
                document.querySelector(".UsernameTXT").innerHTML = "@" + user.nickname;
                document.getElementById("Bio").value = user.bio;

                const skillsArray = user.skills ? user.skills.split(',') : [];
                const skillFields = ["habilidade1", "habilidade2", "habilidade3"];
                skillFields.forEach((field, index) => {
                    if (skillsArray[index]) {
                        document.querySelector(`.${field}`).textContent = skillsArray[index].trim();
                    }
                });

                // Verificar se a div .FotoPerfil existe antes de tentar manipular
                const imgPerfil = document.querySelector(".FotoPerfil");
                if (imgPerfil) {  // Verifique se imgPerfil existe
                    if (user.profilePic && user.profilePic !== "") {
                        imgPerfil.style = "background: none";  // Se a imagem de perfil existir
                        imgPerfil.innerHTML = `<img src="${user.profilePic}" alt="Foto de perfil" style="width: 100px; height: 100px; border-radius: 50%;">`;
                    }
                } else {
                    console.error(".FotoPerfil não encontrado.");
                }
            } else {
                console.error("Não foi possível carregar os dados do usuário.");
            }

            if (projects.length > 0) {
                const projectItems = document.querySelectorAll(".project-item");
                projects.forEach((project, index) => {
                    if (index < projectItems.length) {
                        const projectItem = projectItems[index];
                        const projectTitle = projectItem.querySelector("h3");
                        const projectDescription = projectItem.querySelector("p");
                        const projectLink = projectItem.querySelector("a");

                        projectTitle.textContent = project.name;
                        projectDescription.textContent = project.description || "Sem descrição";
                        projectLink.href = project.html_url;
                        projectLink.textContent = "Ver Projeto";
                    }
                });
            }
        });


        document.getElementById("Salvar").addEventListener("click", async (e) => {
            e.preventDefault();

            const name = document.getElementById("Name").value;
            const bio = document.getElementById("Bio").value;
            const hab1 = document.getElementById("HAB1").value;
            const hab2 = document.getElementById("HAB2").value;
            const hab3 = document.getElementById("HAB3").value;
            const imgInput = document.getElementById("IMG-Input").files[0];
            const nick = sessionStorage.getItem("userNickname");
            const user = await api.findUser(nick)

            const formData = new FormData();
            formData.append("name", name);
            formData.append("userId", user.returnedData.id);
            formData.append("bio", bio);
            formData.append("skills", `${hab1}, ${hab2}, ${hab3}`); // Habilidades
            if (imgInput) formData.append("file", imgInput);

            try {
                const response = await fetch("http://127.0.0.1:3000/users-profile/a", {
                    method: "POST",
                    body: formData,
                });

                const result = await response.json();
                console.log(result);
            } catch (error) {
                console.error("Erro ao enviar dados:", error);
            }
            window.location.href = "/HTML/perfil/perfil.html"
        });


        const imgInput = document.getElementById("IMG-Input");
        const imgPreviewContainer = document.getElementById("imgPreviewContainer");
        const imgPreview = document.getElementById("imgPreview");

        // Adiciona o evento 'change' ao campo de entrada de arquivo
        imgInput.addEventListener("change", function (event) {
            const file = event.target.files[0]; // Obtém o primeiro arquivo selecionado

            if (file) {
                const reader = new FileReader();

                // Quando a leitura do arquivo for concluída, exibe a imagem
                reader.onload = function (e) {
                    imgPreview.src = e.target.result;  // Define a URL da imagem como o resultado da leitura
                    imgPreviewContainer.style.display = "block";  // Exibe o contêiner de pré-visualização
                };

                // Lê o arquivo como uma URL de dados (data URL)
                reader.readAsDataURL(file);
            } else {
                imgPreviewContainer.style.display = "none";  // Oculta o contêiner se nenhum arquivo for selecionado
            }
        });
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        clifford: '#da373d',
                    }
                }
            }
        }
    </script>
</body>

</html>
